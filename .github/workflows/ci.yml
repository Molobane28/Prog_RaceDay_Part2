name: .NET API CI/CD

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore RaceDay.slnx

    - name: Build project
      run: dotnet build RaceDay.slnx --no-restore

    - name: Run Unit Tests
      run: dotnet test RaceDay.slnx --no-build --verbosity normal